<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>New Tab</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <div class="page">
      <div class="search">
        <svg viewBox="0 0 16 16">
          <circle cx="7" cy="7" r="4.25" />
          <path d="M10.2 10.2L13 13" />
        </svg>
        <input id="q" type="text" spellcheck="false" autocomplete="off" placeholder="Search the web" autofocus />
      </div>

      <!-- Speed dials sit directly under the search field, as specified. -->
      <div class="dials" id="dials"></div>

      <div class="hint" id="hint"></div>
    </div>

    <script src="newtab.js"></script>
  </body>
</html>
