<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
    <title>History</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <div class="page">
      <h1>History</h1>
      <p class="sub" id="count"></p>
      <div class="toolbar">
        <label class="field">
          <input id="search" type="text" placeholder="Search history" spellcheck="false" autocomplete="off" />
        </label>
        <button class="btn danger" id="clear">Clear all</button>
      </div>
      <div class="list" id="list"></div>
      <div class="empty" id="empty" hidden>Nothing here yet.</div>
    </div>
    <script src="common.js"></script>
    <script src="history.js"></script>
  </body>
</html>
